# Tight over-the-shoulder take: the camera rides the robot's heading frame, sits just
# behind and above the chassis, and holds. Screen-left is robot-left.
params:
  subject: env_0/jackal/base_link
  duration: 20.0
reference:
  entity: "${subject}"
  mode: yaw
timeline:
  - look: { eye: [-0.9, 0.0, 0.60], target: [3.0, 0.0, 0.35] }
  - hold: { duration: "${duration}" }
